# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.NET Framework app to Azure Web App - newlife-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore NewLife.csproj -PackagesDirectory packages

      - name: Build project
        run: msbuild NewLife.csproj /p:Configuration=Release /p:SkipInvalidConfigurations=true

      - name: Create deploy package
        run: |
          $dest = "deploy"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          # Core runtime files
          Copy-Item -Path "bin" -Destination "$dest\bin" -Recurse -Force
          Copy-Item -Path "web.config" -Destination "$dest\" -Force
          Copy-Item -Path "Global.asax" -Destination "$dest\" -Force

          # Optional: static content if it exists
          foreach ($folder in @("Content","Scripts","App_Data","fonts","images")) {
            if (Test-Path $folder) {
              Copy-Item -Path $folder -Destination "$dest\$folder" -Recurse -Force
            }
          }

          # Azure config
          if (Test-Path "applicationHost.xdt") {
            Copy-Item -Path "applicationHost.xdt" -Destination "$dest\" -Force
          }

          Write-Host "=== deploy dir ==="
          dir $dest
          Write-Host "=== deploy\bin (first 15) ==="
          dir "$dest\bin" | Select-Object -First 15

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F3939F50717643C180A8529F1412C16A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FE688B87FF724EF3823FEBDD183ADEB2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EB7DA4CAA84F40D4A421BD53FAE6F75B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'newlife-api'
          slot-name: 'Production'
          package: deploy
