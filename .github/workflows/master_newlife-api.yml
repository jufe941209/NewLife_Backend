# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.NET Framework app to Azure Web App - newlife-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore NewLife.csproj -PackagesDirectory packages

      - name: Build with MSBuild (FileSystem publish)
        run: msbuild NewLife.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:PublishUrl=published /p:DeleteExistingFiles=True /p:SkipInvalidConfigurations=true

      - name: Verify published output
        run: |
          if (Test-Path "published") {
            Write-Host "OK - published dir exists"
            dir published
          } else {
            Write-Host "ERROR - published dir not found"; dir; exit 1
          }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F3939F50717643C180A8529F1412C16A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FE688B87FF724EF3823FEBDD183ADEB2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EB7DA4CAA84F40D4A421BD53FAE6F75B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'newlife-api'
          slot-name: 'Production'
          package: published
